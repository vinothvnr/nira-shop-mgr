<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nira Log Book</title><link rel="stylesheet" href="css/style.css"><script src="https://accounts.google.com/gsi/client" async defer></script></head><body>
<header class="topbar"><div><h1>LogBook</h1><p id="userSubtitle">Activity & cash log</p></div><div class="actions"><span id="syncStatus" class="pill">Local only</span><button id="loginBtn" class="btn primary small">Login</button><button id="logoutBtn" class="btn secondary small hidden">Logout</button></div></header>
<main class="container"><section id="loginCard" class="card auth"><h2>Login required</h2><p>Sign in with your authorized Google account.</p><div id="googleButton"></div><p id="authMessage" class="muted"></p></section>
<div id="appContent" class="hidden"><section class="card"><h2>Add Log</h2><form id="logForm"><div class="grid"><label>Log Type<select id="logType"><option>Log</option><option>Cashin</option><option>Cashout</option><option>Distributor visit</option><option>Cust. Feedback</option></select></label><label>Description<textarea id="description" rows="3" required></textarea></label><label id="amountField" class="hidden">Amount<input id="amount" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00"></label><label>Status<select id="status"><option>NA</option><option>Ordered</option><option>Received</option><option>Payment pending</option><option>Paid cheque</option><option>Paid Cash</option><option>Inventory added</option></select></label></div><button class="btn primary" id="saveBtn">Add Log</button><button type="button" class="btn secondary hidden" id="cancelEditBtn">Cancel</button></form></section>
<section class="card"><div class="heading"><div><h2>Google Sheets</h2><span id="syncDetails" class="muted">Settings hidden</span></div><button id="toggleSync" class="btn secondary small">Show Sync Settings</button></div><div id="syncPanel" class="hidden"><input id="sheetUrl" class="search" placeholder="Google Apps Script Web App URL"><button id="saveSheetUrl" class="btn primary">Save URL</button><button id="syncNow" class="btn secondary">Sync Now</button></div></section>
<section><div class="heading"><h2>Dashboard</h2></div><div id="statsGrid" class="stats"></div></section><section class="card"><div class="heading"><h2>Logs</h2><input id="searchInput" class="search" placeholder="Search..."></div><div class="table"><table><thead><tr><th>Timestamp</th><th>User</th><th>Log Type</th><th>Description</th><th>Amount</th><th>Status</th><th>Actions</th></tr></thead><tbody id="logTableBody"></tbody></table></div><p id="emptyState" class="empty">No logs yet.</p></section></div></main><div id="toast" class="toast"></div>
<script src="js/storage.js"></script><script src="js/auth.js"></script><script src="js/sheets.js"></script><script src="js/app.js"></script></body></html>
