<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2563eb">
  <title>LogBook</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>LogBook</h1>
      <p>Simple activity & cash log</p>
    </div>
    <button id="clearAllBtn" class="btn btn-danger btn-small">Clear All</button>
  </header>

  <main class="container">
    <section class="card">
      <h2>Add Log</h2>
      <form id="logForm">
        <div class="form-grid">
          <label>
            Log Type
            <select id="logType" required>
              <option value="Log" selected>Log</option>
              <option>Cashin</option>
              <option>Cashout</option>
              <option>Distributor visit</option>
              <option>Cust. Feedback</option>
            </select>
          </label>

          <label>
            Description
            <textarea id="description" rows="3" placeholder="Enter description..." required></textarea>
          </label>

          <label>
            Status
            <select id="status" required>
              <option value="NA" selected>NA</option>
              <option>Ordered</option>
              <option>Received</option>
              <option>Payment pending</option>
              <option>Paid cheque</option>
              <option>Paid Cash</option>
              <option>Inventory added</option>
            </select>
          </label>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="saveBtn">Add Log</button>
          <button type="button" class="btn btn-secondary hidden" id="cancelEditBtn">Cancel Edit</button>
        </div>
      </form>
    </section>

    <section class="dashboard">
      <div class="section-heading">
        <h2>Dashboard</h2>
        <button id="refreshDashboard" class="btn btn-secondary btn-small">Refresh</button>
      </div>
      <div class="stats-grid" id="statsGrid"></div>
    </section>

    <section class="card">
      <div class="section-heading">
        <h2>Logs</h2>
        <input id="searchInput" class="search" type="search" placeholder="Search description...">
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Timestamp</th>
              <th>Log Type</th>
              <th>Description</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="logTableBody"></tbody>
        </table>
      </div>
      <p id="emptyState" class="empty">No logs yet. Add your first log above.</p>
    </section>
  </main>

  <div id="toast" class="toast"></div>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
